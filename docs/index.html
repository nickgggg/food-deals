<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restaurant Deals</title>
    <script>
      document.documentElement.dataset.theme = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <link rel="stylesheet" href="styles.css?v=5">
  </head>
  <body>
    <header class="topbar">
      <h1>Restaurant Deals</h1>
      <div class="header-actions">
        <div class="stats" id="stats" aria-live="polite"></div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Use dark mode" title="Use dark mode">
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.5 0-1-.1-1.5A7 7 0 0 1 12 3Z"></path></svg>
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path></svg>
        </button>
      </div>
    </header>

    <main>
      <section class="controls" id="filters" aria-label="Deal filters">
        <div class="filter-toolbar">
          <button id="filter-toggle" class="filter-toggle" type="button" aria-expanded="false" aria-controls="filter-fields">
            Filters <span id="filter-count" class="filter-count" hidden></span>
          </button>
          <span id="filter-summary" class="filter-summary">Today · All restaurants</span>
        </div>
        <div class="filter-fields" id="filter-fields">
          <label class="search-control">
          Search
          <input id="search" type="search" placeholder="happy hour, tacos, beer">
          </label>
          <label>
          Restaurant
          <select id="restaurant">
            <option value="">All restaurants</option>
          </select>
          </label>
          <label>
          City
          <select id="city">
            <option value="">All cities</option>
          </select>
          </label>
          <label>
          Day
          <select id="day">
            <option value="today">Today</option>
            <option value="">Any day</option>
            <option value="monday">Mon</option>
            <option value="tuesday">Tue</option>
            <option value="wednesday">Wed</option>
            <option value="thursday">Thu</option>
            <option value="friday">Fri</option>
            <option value="saturday">Sat</option>
            <option value="sunday">Sun</option>
          </select>
          </label>
          <label>
          Type
          <select id="category">
            <option value="">Food + drink</option>
            <option value="food">Food</option>
            <option value="drink">Drink</option>
            <option value="general">General</option>
          </select>
          </label>
          <label>
          Offer
          <select id="kind">
            <option value="">All deals</option>
            <option value="happy_hour">Happy hour</option>
            <option value="other">Other specials</option>
          </select>
          </label>
          <label>
          Status
          <select id="status">
            <option value="active">Active</option>
            <option value="">Active + stale</option>
            <option value="stale">Stale only</option>
          </select>
          </label>
          <button id="locate" class="locate-button" type="button">Use my location</button>
        </div>
      </section>

      <section class="meta" id="meta"></section>
      <section class="deals" id="deals" aria-live="polite"></section>
      <section class="sources" id="sources"></section>
      <footer>
        <p>Deals refresh daily at 14:37 UTC (6:37 or 7:37 AM Pacific). Restaurant coverage refreshes weekly.</p>
        <p>Restaurant details supplied by Google Maps. Deal terms come from linked restaurant sources.</p>
      </footer>
    </main>

    <script src="app.js?v=4"></script>
  </body>
</html>
