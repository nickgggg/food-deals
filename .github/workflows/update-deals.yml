name: Update deals

on:
  push:
    branches:
      - main
    paths:
      - crawler/**
      - .github/workflows/update-deals.yml
  schedule:
    - cron: "37 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crawl deals
        run: python crawler/crawl_deals.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update deals data"
          file_pattern: docs/data/deals.json
